name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bunx tsc --noEmit

            - name: Test
              run: bun run test:run

            - name: Build
              if: ${{ secrets.NEXT_PUBLIC_CONVEX_URL != '' }}
              run: bun run build
              env:
                  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
                  CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
                  POLARIS_CONVEX_INTERNAL_KEY: ${{ secrets.POLARIS_CONVEX_INTERNAL_KEY }}
                  NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
                  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
                  CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
                  INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
                  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
